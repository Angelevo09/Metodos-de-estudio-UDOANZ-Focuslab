<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusLab - Métodos de Estudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Barra de navegación -->
    <nav class="navbar">
      <a class="nav-brand" id="nav-home">
        <span>★</span>
        <span>FocusLab</span>
      </a>

      <div class="nav-links">
        <button class="nav-link" id="nav-methods">Métodos de Estudio</button>
        
        <!-- Contenedor dinámico: Botones Login/Registro O Avatar con Dropdown -->
        <div id="auth-controls"></div>
      </div>
    </nav>

    <!-- Contenedor principal donde cambian las pantallas -->
    <main id="app"></main>

    <!-- Modal de Inicio de Sesión / Registro -->
    <div class="modal-backdrop hidden" id="auth-modal">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modal-title">Iniciar Sesión</h3>
          <button class="close-modal" id="close-modal">&times;</button>
        </div>
        <form id="auth-form">
          <div class="form-group">
            <label for="auth-email">Correo electrónico</label>
            <input type="email" id="auth-email" required placeholder="tu@correo.com" />
          </div>
          <div class="form-group">
            <label for="auth-password">Contraseña (mín. 6 caracteres)</label>
            <input type="password" id="auth-password" required minlength="6" placeholder="••••••" />
          </div>
          <p class="auth-error" id="auth-error"></p>
          <button type="submit" class="btn btn-primary" style="width: 100%;" id="auth-submit-btn">
            Entrar
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
